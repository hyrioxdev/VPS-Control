<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VPS Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#06080d;color:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .login-container{width:100%;max-width:420px;padding:20px}
    .login-card{background:#111722;border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:48px 40px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.5)}
    .logo{width:72px;height:72px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 32px rgba(99,102,241,0.3)}
    .logo svg{color:#fff}
    h1{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px}
    .subtitle{font-size:14px;color:#556677;margin-bottom:36px}
    .discord-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 24px;background:#5865F2;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:'Inter',system-ui,sans-serif;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 16px rgba(88,101,242,0.3)}
    .discord-btn:hover{background:#4752C4;transform:translateY(-2px);box-shadow:0 8px 24px rgba(88,101,242,0.4)}
    .discord-btn:active{transform:translateY(0)}
    .discord-btn svg{width:22px;height:22px}
    .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#f87171;font-size:13px;display:none}
    .error-msg.show{display:block}
    .footer{margin-top:24px;font-size:12px;color:#334455}
    .footer a{color:#6366f1;text-decoration:none}
    .locked-icon{margin-bottom:20px;color:#556677}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
        </svg>
      </div>
      <h1>VPS Manager</h1>
      <p class="subtitle">Sign in with Discord to access the control panel</p>

      <div id="error-box" class="error-msg"></div>

      <a href="/auth/login">
        <button class="discord-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
          Login with Discord
        </button>
      </a>

      <div class="footer">Authorized users only</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const box = document.getElementById('error-box');
      const errors = {
        unauthorized: 'You are not authorized to access this panel.',
        no_code: 'Authentication failed - no code received.',
        token_failed: 'Failed to get access token from Discord.',
        user_fetch_failed: 'Failed to fetch your Discord user info.',
        auth_failed: 'Authentication process failed. Please try again.'
      };
      box.textContent = errors[error] || 'An error occurred during authentication.';
      box.classList.add('show');
    }
  </script>
</body>
</html>
